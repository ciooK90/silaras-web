{% extends 'base.html' %}{% block content %}<section class="panel narrow"><div class="panel-head"><div><h3>Edit penugasan</h3><p>Perbarui informasi penugasan.</p></div></div><form method="post" class="form-grid"><label>Nama OPD *<input name="opd" value="{{ row.opd }}" required></label><label>Jenis reviu<select name="review_type">{% for x in ['Reviu RKA','Reviu LKPD','Reviu lainnya','Evaluasi','Pemeriksaan'] %}<option {% if row.review_type==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Tahun anggaran<input type="number" name="fiscal_year" value="{{ row.fiscal_year }}" required></label><label>Tim reviu<input name="team" value="{{ row.team or '' }}"></label><label>Tanggal mulai<input type="date" name="start_date" value="{{ row.start_date or '' }}"></label><label>Tanggal selesai<input type="date" name="end_date" value="{{ row.end_date or '' }}"></label><label>Status<select name="status">{% for x in ['Berjalan','Menunggu','Selesai'] %}<option {% if row.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label class="span-2">Catatan<textarea name="notes" rows="3">{{ row.notes or '' }}</textarea></label><div class="span-2 form-actions"><button class="btn primary">Simpan perubahan</button><a class="btn" href="{{ url_for('assignments') }}">Batal</a></div></form></section>{% endblock %}
